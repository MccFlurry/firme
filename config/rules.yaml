  origen: PUBLICO
  impacts: {}
  fix: null
  abstain: true
- id: R38_promo_duracion_no_verificable
  name: Duración promocional sin referencia verificable
  description: La promesa indica duración promocional; las superficies difieren y falta catalogo_referencia_id para
    verificarla.
  edge: promesa-catalogo
  severity: media
  strength: determinista
  condition: promise_promo_duration and not catalogo_referencia_id
