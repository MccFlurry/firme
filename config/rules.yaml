- id: R29_promo_prometida_no_aplicable
  name: Promoción prometida no combinable
  description: La promoción prometida {promise_promo} no aplica al plan prometido {promise_plan}.
  condition: promise_promo is not None and promise_promo_applies is False
  severity: media
  message: La promoción prometida {promise_promo} no aplica al plan prometido {promise_plan}.
  source: Supuesto del equipo para la demo (config/rules.yaml); no es una política de WIN.
  origen: SUPUESTO_DEMO
  fuente: Supuesto del equipo para la demo (config/rules.yaml); no es una política de WIN.
  edge: promesa-catalogo
  strength: determinista
  inputs:
  - promise_plan
  - promise_promo
  - promise_promo_applies
  impacts:
    reclamo: 0.3
    reversion_facturacion: 0.35
  fix: null
- id: R30_permanencia_prometida
  name: Permanencia prometida distinta del contrato
  description: La promesa dice sin permanencia; el registro indica {plazo_vigencia}.
  edge: promesa-registro
  severity: alta
  strength: determinista
  condition: promise_no_term and plazo_vigencia is not None and plazo_vigencia.startswith("forzoso")
  inputs:
  - promise_no_term
  - plazo_vigencia
  message: La promesa dice sin permanencia; el registro indica {plazo_vigencia}.
  source: docs/EVIDENCIA-PUBLICA.md §2.5 (cartilla) y §4 (Anexo 1), permanencia forzosa
  fuente: docs/EVIDENCIA-PUBLICA.md §2.5 (cartilla) y §4 (Anexo 1), permanencia forzosa
  origen: PUBLICO
  impacts:
    baja_temprana: 0.35
    reclamo: 0.1
  fix: null
- id: R31_recibo_fisico_no_declarado
  name: Recibo físico no declarado en la promesa
  description: 'Se prometió S/ {promise_price} al mes sin declarar el recibo físico: agrega S/ {paper_invoice_fee},
    total S/ {expected_monthly_total}.'
  edge: promesa-registro
  severity: media
  strength: determinista
  condition: forma_entrega_recibo == "fisico" and promise_price is not None and not promise_mentions_recibo
  inputs:
  - forma_entrega_recibo
  - promise_price
  - promise_mentions_recibo
  - promise_all_inclusive
  - paper_invoice_fee
  - expected_monthly_total
  message: 'Se prometió S/ {promise_price} al mes sin declarar el recibo físico: agrega S/ {paper_invoice_fee},
    total S/ {expected_monthly_total}.'
  source: 'docs/EVIDENCIA-PUBLICA.md §4, Anexo 1: Forma de entrega del Recibo; P-03'
  fuente: 'docs/EVIDENCIA-PUBLICA.md §4, Anexo 1: Forma de entrega del Recibo; P-03'
  origen: PUBLICO
  impacts:
    reclamo: 0.3
    reversion_facturacion: 0.35
  fix: null
- id: R32_score_bajo_minimo
  name: Score por debajo del mínimo publicado
  description: Score registrado {score_crediticio}; mínimo publicado {min_credit_score}.
  edge: catalogo-registro
  severity: alta
  strength: determinista
  condition: score_crediticio is not None and score_crediticio < min_credit_score
  inputs:
  - score_crediticio
  - min_credit_score
  message: Score registrado {score_crediticio}; mínimo publicado {min_credit_score}.
  source: 'docs/EVIDENCIA-PUBLICA.md §2.3, cartilla: requisitos de acceso'
  fuente: 'docs/EVIDENCIA-PUBLICA.md §2.3, cartilla: requisitos de acceso'
  origen: PUBLICO
  impacts:
    baja_temprana: 0.3
    reversion_facturacion: 0.15
  fix: null
- id: R33_titular_no_verificable
  name: No se puede verificar al firmante
  description: La confirmación llegó al teléfono registrado y no hay evidencia de que ese número sea del firmante.
  edge: identidad
  severity: media
  strength: determinista
  condition: tenencia == "inquilino" and confirmation_status == "confirmada" and phone and not consent_evidence
  inputs:
  - tenencia
  - confirmation_status
  - phone
  - consent_evidence
  message: La confirmación llegó al teléfono registrado y no hay evidencia de que ese número sea del firmante.
  source: docs/EVIDENCIA-PUBLICA.md §4, Anexo 1; CONTRATO-DE-DATOS.md §6; docs/CASOS-ADVERSARIOS.md §5 AMB-04
  fuente: docs/EVIDENCIA-PUBLICA.md §4, Anexo 1; CONTRATO-DE-DATOS.md §6; docs/CASOS-ADVERSARIOS.md §5 AMB-04
  origen: PUBLICO
  impacts: {}
  fix: null
  abstain: true
- id: R34_condominio_sin_unidad
  name: Condominio sin unidad de instalación
  description: 'El condominio {nombre_condominio} no tiene torre o departamento: no se puede dirigir la instalación
    a una unidad.'
  edge: registro-entrega
  severity: media
  strength: determinista
  condition: nombre_condominio and (not torre or not departamento)
  inputs:
  - nombre_condominio
  - torre
  - departamento
  message: 'El condominio {nombre_condominio} no tiene torre o departamento: no se puede dirigir la instalación
    a una unidad.'
  source: 'docs/EVIDENCIA-PUBLICA.md §4, Anexo 1: datos de instalación'
  fuente: 'docs/EVIDENCIA-PUBLICA.md §4, Anexo 1: datos de instalación'
  origen: PUBLICO
  impacts:
    instalacion_fallida: 0.4
  fix: null
- id: R35_primera_factura_no_declarada
  name: Primera factura no declarada en la promesa
  description: Se prometió S/ {promise_price} al mes. La primera factura incluye prorrateo + renta + cuota de instalación
    S/ {installation_quota} + S/ {paper_invoice_fee} si el recibo es físico; esos cargos no se declararon.
  edge: registro-entrega
  severity: media
  strength: determinista
  condition: (cargo_instalacion_cuotas is not None or cargo_instalacion_costo is not None) and promise_price is
    not None and not promise_mentions_installation_fee
  inputs:
  - cargo_instalacion_cuotas
  - cargo_instalacion_costo
  - promise_price
  - promise_mentions_installation_fee
  - promise_all_inclusive
  - installation_quota
  - paper_invoice_fee
  - forma_entrega_recibo
  message: Se prometió S/ {promise_price} al mes. La primera factura incluye prorrateo + renta + cuota de instalación
    S/ {installation_quota} + S/ {paper_invoice_fee} si el recibo es físico; esos cargos no se declararon.
  source: docs/EVIDENCIA-PUBLICA.md §2.2 y §2.6 (cartilla), §5 primera factura; P-02 y P-03
  fuente: docs/EVIDENCIA-PUBLICA.md §2.2 y §2.6 (cartilla), §5 primera factura; P-02 y P-03
  origen: PUBLICO
  impacts:
    reclamo: 0.3
    reversion_facturacion: 0.35
  fix: null
- id: R36_plan_fuera_de_zona
  name: Plan restringido a otra región
  description: El plan {plan} aplica solo a provincias; la dirección registrada está en {address_region}.
  edge: registro-entrega
  severity: alta
  strength: determinista
  condition: plan_zones == ["provincias"] and address_region == "lima"
  inputs:
  - plan
  - plan_zones
  - address_region
  - address
  message: El plan {plan} aplica solo a provincias; la dirección registrada está en {address_region}.
  source: 'docs/EVIDENCIA-PUBLICA.md §2.1 y §2.4, cartilla: 100 Mbps solo provincias'
  fuente: 'docs/EVIDENCIA-PUBLICA.md §2.1 y §2.4, cartilla: 100 Mbps solo provincias'
  origen: PUBLICO
  impacts:
    instalacion_fallida: 0.5
  fix: null
- id: R37_catalogo_ambiguo
  name: Falta el catálogo que gobierna esta velocidad
  description: La velocidad existe en superficies web, pero no en la cartilla. Sin catalogo_referencia_id no se
    puede afirmar un defecto.
