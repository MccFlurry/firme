app = "win-reto03"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# Deploy with fly deploy --ha=false to keep a single JSON owner.
# ponytail: ephemeral JSON; add a volume before relying on persistent state.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
